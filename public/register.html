<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker - Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card">
    <h1>Create account</h1>
    <p class="subtitle">Start tracking your applications</p>

    <form id="registerForm">
      <label for="name">Name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password (min 6 characters)</label>
      <input type="password" id="password" minlength="6" required>

      <button type="submit" id="submitBtn">Register</button>
    </form>

    <div id="message" class="message"></div>

    <p class="switch">Already have an account? <a href="/index.html">Log in</a></p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;

      try {
        await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });

        showMessage(message, 'Account created! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1200);
      } catch (err) {
        showMessage(message, err.message, 'error');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
