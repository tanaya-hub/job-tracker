<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker - Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <header class="topbar">
    <h1>Job Tracker</h1>
    <div class="topbar-right">
      <span id="greeting"></span>
      <button id="logoutBtn" class="btn btn-pink btn-small">Log out</button>
    </div>
  </header>

  <main class="container">
    <section class="stats">
      <div class="stat-card stat-total">
        <span class="stat-number" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card stat-wishlist">
        <span class="stat-number" id="stat-wishlist">0</span>
        <span class="stat-label">Wishlist</span>
      </div>
      <div class="stat-card stat-applied">
        <span class="stat-number" id="stat-applied">0</span>
        <span class="stat-label">Applied</span>
      </div>
      <div class="stat-card stat-interview">
        <span class="stat-number" id="stat-interview">0</span>
        <span class="stat-label">Interview</span>
      </div>
      <div class="stat-card stat-offer">
        <span class="stat-number" id="stat-offer">0</span>
        <span class="stat-label">Offer</span>
      </div>
      <div class="stat-card stat-rejected">
        <span class="stat-number" id="stat-rejected">0</span>
        <span class="stat-label">Rejected</span>
      </div>
    </section>

    <section class="panel">
      <h2>Add a company</h2>
      <form id="companyForm" class="grid">
        <div class="field">
          <label for="companyName">Company name</label>
          <input type="text" id="companyName" required>
        </div>
        <div class="field">
          <label for="companyLocation">Location</label>
          <input type="text" id="companyLocation">
        </div>
        <div class="field">
          <label for="companyWebsite">Website</label>
          <input type="text" id="companyWebsite">
        </div>
        <button type="submit" class="btn btn-mint">Add company</button>
      </form>
      <div id="companyMsg" class="message"></div>
    </section>

    <section class="panel">
      <h2>Add an application</h2>
      <form id="appForm" class="grid">
        <div class="field">
          <label for="appCompany">Company</label>
          <select id="appCompany" required></select>
        </div>
        <div class="field">
          <label for="appTitle">Job title</label>
          <input type="text" id="appTitle" required>
        </div>
        <div class="field">
          <label for="appStatus">Status</label>
          <select id="appStatus">
            <option value="wishlist">Wishlist</option>
            <option value="applied">Applied</option>
            <option value="interview">Interview</option>
            <option value="offer">Offer</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="field">
          <label for="appDate">Applied date</label>
          <input type="date" id="appDate">
        </div>
        <div class="field">
          <label for="appUrl">Job link</label>
          <input type="text" id="appUrl">
        </div>
        <button type="submit" class="btn">Add application</button>
      </form>
      <div id="appMsg" class="message"></div>
    </section>

    <section class="panel">
      <h2>My applications</h2>

      <form id="filterForm" class="filters">
        <input type="text" id="searchInput" placeholder="Search by job title or company">
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="wishlist">Wishlist</option>
          <option value="applied">Applied</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>
        <button type="submit" class="btn">Filter</button>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Job title</th>
              <th>Company</th>
              <th>Status</th>
              <th>Applied</th>
              <th>Link</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="appRows"></tbody>
        </table>
      </div>

      <div class="pagination">
        <span id="pageInfo"></span>
        <div>
          <button id="prevBtn" class="btn btn-small">Previous</button>
          <button id="nextBtn" class="btn btn-small">Next</button>
        </div>
      </div>
      <div id="listMsg" class="message"></div>
    </section>
  </main>

  <div id="notesModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="notesTitle">Interview notes</h2>
        <button id="closeNotes" class="btn btn-pink btn-small">Close</button>
      </div>

      <div id="notesList"></div>

      <h3>Add a round</h3>
      <form id="noteForm" class="grid">
        <div class="field">
          <label for="noteRound">Round name</label>
          <input type="text" id="noteRound" placeholder="Technical Round 1" required>
        </div>
        <div class="field">
          <label for="noteDate">Interview date</label>
          <input type="date" id="noteDate">
        </div>
        <div class="field">
          <label for="noteMode">Mode</label>
          <select id="noteMode">
            <option value="online">Online</option>
            <option value="offline">Offline</option>
            <option value="phone">Phone</option>
          </select>
        </div>
        <div class="field">
          <label for="noteOutcome">Outcome</label>
          <select id="noteOutcome">
            <option value="pending">Pending</option>
            <option value="passed">Passed</option>
            <option value="failed">Failed</option>
          </select>
        </div>
        <div class="field full">
          <label for="noteQuestions">Questions asked (one per line)</label>
          <textarea id="noteQuestions" rows="3"></textarea>
        </div>
        <div class="field full">
          <label for="noteText">Notes</label>
          <textarea id="noteText" rows="3"></textarea>
        </div>
        <button type="submit" class="btn">Save note</button>
      </form>
      <div id="noteMsg" class="message"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/notes.js"></script>
</body>
</html>
